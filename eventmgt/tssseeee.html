<script src="//code.jquery.com/jquery-1.12.4.min.js"></script>

<script>
$(document).ready(function () {

    function extractFileUrl($a) {
        var href = $a.prop("href") || "";

        // 1. Direct .dotx
        if (href.toLowerCase().endsWith(".dotx")) return href;

        // 2. Extract from download.aspx?SourceUrl=...
        var m = href.match(/SourceUrl=([^&]+)/i);
        if (m) return decodeURIComponent(m[1]);

        // 3. Check onclick (SharePoint uses OpenPopUpPageWithTitle)
        var onclick = $a.attr("onclick") || "";
        var m2 = onclick.match(/['"]([^'"]+\.dotx[^'"]*)['"]/i);
        if (m2) return m2[1];

        return null;
    }

    function rewriteDotxLinks(container) {
        $(container).find("a").each(function () {
            var $a = $(this);
            var fileUrl = extractFileUrl($a);

            if (!fileUrl || !fileUrl.toLowerCase().endsWith(".dotx"))
                return;

            // normalize relative URL
            if (fileUrl.startsWith("/")) {
                fileUrl = window.location.origin + fileUrl;
            }

            // use correct protocol
            var msUrl = "ms-word:nft|u|" + fileUrl;

            $a.attr("href", msUrl);
            $a.removeAttr("target");
        });
    }

    // Initial run
    rewriteDotxLinks(document);

    // Handle AJAX updates
    new MutationObserver(function (mutations) {
        mutations.forEach(function (m) {
            if (m.addedNodes.length)
                rewriteDotxLinks(m.addedNodes);
        });
    }).observe(document.body, { childList: true, subtree: true });

});
</script>
<style>

.ms-listviewtable {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 16px;
    border-collapse: separate !important;

.ms-listviewtable > tbody > tr {
    display: block !important;
    width: calc(33.333% - 16px) !important; /* 3 columns */
    min-height: 160px;
    background: #fff;
    border: 1px solid #dadada;
    border-radius: 8px;
    padding: 12px 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    transition: 0.2s ease;
}

/* Hover effect */
.ms-listviewtable > tbody > tr:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

/* HIDE COLUMN HEADERS (OPTIONAL) */
.ms-viewheadertr {
    display: none !important;
}

/* EACH CELL BECOMES A FULL-WIDTH BLOCK INSIDE THE CARD */
.ms-listviewtable td {
    display: block !important;
    width: 100% !important;
    padding: 2px 0 !important;
    border: none !important;
}

/* TITLE FIELD (makes file name stand out) */
.ms-vb-title {
    font-size: 16px !important;
    font-weight: 600 !important;
    margin-bottom: 6px !important;
    display: inline-block !important;
}

/* OPTIONAL: REDUCE ECB (three dots) positioning */
.ms-vb-itmcbx, .ms-vb-itm {
    margin-bottom: 6px !important;
}

/* RESPONSIVE — 2 columns on medium screens */
@media (max-width: 1200px) {
    .ms-listviewtable > tbody > tr {
        width: calc(50% - 16px) !important;
    }
}

/* 1 column on mobile */
@media (max-width: 768px) {
    .ms-listviewtable > tbody > tr {
        width: 100% !important;
    }
}
</style>

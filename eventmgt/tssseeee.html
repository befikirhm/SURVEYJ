<script src="//code.jquery.com/jquery-1.12.4.min.js"></script>

<script>
(function ($) {
    var DEBUG = true;

    function log() {
        if (DEBUG) console.log.apply(console, arguments);
    }

    function extractUrl($a) {
        var href = $a.attr('href') || '';
        var propHref = $a.prop('href') || '';
        var onclick = $a.attr('onclick') || '';

        // Direct href
        if (href.toLowerCase().endsWith('.dotx')) return href;

        // Absolute URL via prop()
        if (propHref.toLowerCase().endsWith('.dotx')) return propHref;

        // Look inside onclick if SharePoint wrapped it
        var m = onclick.match(/['"]([^'"]+\.dotx[^'"]*)['"]/i);
        if (m) return m[1];

        return null;
    }

    function normalize(url) {
        if (!url) return null;
        if (url.indexOf('/') === 0) return window.location.origin + url;

        var a = document.createElement('a');
        a.href = url;
        return a.href;
    }

    function rewriteLinks(context) {
        log("Scanning for DOTX links...");

        $(context).find("a").each(function () {
            var $a = $(this);
            var url = extractUrl($a);

            if (!url) return;

            url = normalize(url);

            if (!url || !url.toLowerCase().endsWith(".dotx")) return;

            log("DOTX template found:", url);

            // Build ms-word link (safe for clicks)
            var msUrl = "ms-word:ofe|u|" + url;

            $a.attr("href", msUrl);
            // Important: keep target same window → no popup blocker
            $a.removeAttr("target");

            $a.attr("data-dotx-rewritten", "true");

            log("Rewritten:", msUrl);
        });

        log("Rewrite complete.");
    }

    $(document).ready(function () {
        // Initial run
        rewriteLinks(document);

        // Handle async list updates (filter, sort, paging)
        var observer = new MutationObserver(function (muts) {
            muts.forEach(function (m) {
                if (m.addedNodes.length) rewriteLinks(m.addedNodes);
            });
        });

        observer.observe(document.body, { childList: true, subtree: true });
    });

})(jQuery);
</script>

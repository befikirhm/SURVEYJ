<script src="//code.jquery.com/jquery-1.12.4.min.js"></script>

<script>
$(document).ready(function () {

    function extractFileUrl($a) {
        var href = $a.prop("href") || "";

        // 1. Direct .dotx
        if (href.toLowerCase().endsWith(".dotx")) return href;

        // 2. Extract from download.aspx?SourceUrl=...
        var m = href.match(/SourceUrl=([^&]+)/i);
        if (m) return decodeURIComponent(m[1]);

        // 3. Check onclick (SharePoint uses OpenPopUpPageWithTitle)
        var onclick = $a.attr("onclick") || "";
        var m2 = onclick.match(/['"]([^'"]+\.dotx[^'"]*)['"]/i);
        if (m2) return m2[1];

        return null;
    }

    function rewriteDotxLinks(container) {
        $(container).find("a").each(function () {
            var $a = $(this);
            var fileUrl = extractFileUrl($a);

            if (!fileUrl || !fileUrl.toLowerCase().endsWith(".dotx"))
                return;

            // normalize relative URL
            if (fileUrl.startsWith("/")) {
                fileUrl = window.location.origin + fileUrl;
            }

            // use correct protocol
            var msUrl = "ms-word:nft|u|" + fileUrl;

            $a.attr("href", msUrl);
            $a.removeAttr("target");
        });
    }

    // Initial run
    rewriteDotxLinks(document);

    // Handle AJAX updates
    new MutationObserver(function (mutations) {
        mutations.forEach(function (m) {
            if (m.addedNodes.length)
                rewriteDotxLinks(m.addedNodes);
        });
    }).observe(document.body, { childList: true, subtree: true });

});
</script>
